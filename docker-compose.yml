services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-cambiar_esto}
    # Sin puerto publicado: solo la API lo alcanza por la red interna.
    expose:
      - "8080"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: searxng-api
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - cache-data:/data
    environment:
      - SEARX_URL=http://searxng:8080
      - DEFAULT_LIMIT=${DEFAULT_LIMIT:-20}
      - MAX_LIMIT=${MAX_LIMIT:-50}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - API_KEY=${API_KEY:-}
      - UPSTREAM_TIMEOUT=${UPSTREAM_TIMEOUT:-25}
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  cache-data:
